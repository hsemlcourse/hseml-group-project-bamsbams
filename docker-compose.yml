services:
  project:
    build:
      context: .
      dockerfile: Dockerfile
    image: hseml-pinn:latest
    working_dir: /app
    volumes:
      - ./:/app
    command: python3 -m src.data_parsing

  api:
    build:
      context: .
      dockerfile: fastapi/Dockerfile
    image: hseml-pinn-api:latest
    working_dir: /app
    volumes:
      - ./:/app
    ports:
      - "8000:8000"
    command: uvicorn main:app --app-dir fastapi --host 0.0.0.0 --port 8000

  streamlit:
    build:
      context: .
      dockerfile: streamlit/Dockerfile
    image: hseml-pinn-streamlit:latest
    working_dir: /app
    volumes:
      - ./:/app
    ports:
      - "8501:8501"
    command: streamlit run streamlit/app.py --server.address=0.0.0.0 --server.port=8501
